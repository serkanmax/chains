buildscript {
    ext {
        // Updated to latest stable versions for security and stability
        KOTLIN_VERSION = "1.9.25"       // Upgrade from 1.9.0 → bugfixes & compiler stability
        KETHEREUM_VERSION = "0.85.9"    // Minor upgrade (latest stable at time of writing)
    }

    repositories {
        gradlePluginPortal()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${KOTLIN_VERSION}"
        classpath "com.github.ben-manes:gradle-versions-plugin:0.51.0" // Upgrade from 0.47.0
    }
}

subprojects {
    apply plugin: "kotlin"

    repositories {
        mavenCentral()
        // Jitpack is a potential supply-chain risk → use only if strictly necessary
        maven { url "https://jitpack.io" }
    }
}

